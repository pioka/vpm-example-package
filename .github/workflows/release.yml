name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - id: checkout
        uses: actions/checkout@v4

      - id: create_release
        run: ./.github/scripts/create_release.sh
        env:
          GH_TOKEN: ${{ github.token }}

  publish-listing:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: checkout
        uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - id: build_listing
        run: ./.github/scripts/build_listing.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}

      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
